version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Assuming dev Dockerfile is the same or handled by target
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Mount code for hot-reloading
    env_file:
      - ./backend/.env.example # Start with example, override with .env if present
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development  # 这一行很重要！
    ports:
      - "3000:3000" # Vite dev server port
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoids overwriting node_modules from host
    env_file:
      - ./frontend/.env.example
    command: npm run dev -- --host # Ensure Vite listens on 0.0.0.0

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432" # Use a different host port for dev to avoid conflict
    environment:
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=auth_dev_db

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # Use a different host port for dev

  nginx:
    build: ./nginx
    ports:
      - "8080:80" # Dev Nginx on 8080
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_dev_data:
