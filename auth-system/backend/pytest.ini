[pytest]
# Set the Python path to include the app directory
pythonpath = . app

# Specify the directory for tests
testpaths = app/tests

# Options for pytest-cov (coverage)
# Add --cov-report html to generate an HTML report
addopts = --cov=app --cov-report term-missing --cov-fail-under=80

# Register custom markers, if any
# markers =
#     slow: marks tests as slow to run
#     integration: marks integration tests

# Environment variables for tests (if needed)
# env =
#     SOME_VARIABLE=some_value

# Asyncio mode for pytest-asyncio
asyncio_mode = auto
